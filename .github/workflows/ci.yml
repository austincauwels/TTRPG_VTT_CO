# Runs the backend's characterization tests and the frontend's production build on every
# push and pull request, so a change that breaks either shows up before it reaches the
# beta site. The tests need PostgreSQL: several of them check row locks and column types
# that SQLite does not have. The database here is a throwaway one; the suite refuses
# DATABASE_URL values that point at candela_obscura.db.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: candela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/candela_test
          CORS_ORIGINS: http://localhost:5173,http://localhost:4173
          # tests/test_creation.py reads the frontend's tables with Node; here it must run
          REQUIRE_FRONTEND_TABLES: "1"
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # .npmrc caps the build's heap at what the server that builds the site has, so a
      # build that grows past it fails here first
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
