<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InkStamp</title><style>body{background:var(--parchment)}</style></head>
<body>
<div class="co-stage co-on-paper" style="gap:var(--space-xl)">
  <span class="co-ink-stamp" data-outcome="failure" style="--tilt:-2deg">Failure</span>
  <span class="co-ink-stamp" data-outcome="mixed" style="--tilt:1.5deg">Mixed Success</span>
  <span class="co-ink-stamp" data-outcome="full" style="--tilt:-1deg">Full Success</span>
  <span class="co-ink-stamp" data-outcome="critical" style="--tilt:2.5deg">Critical</span>
</div>
</body>
</html>
