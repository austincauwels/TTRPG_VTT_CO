<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PaperSheet</title></head>
<body>
<div style="padding:var(--space-xl)">
<section class="co-paper" style="max-width:640px">
  <div class="co-fold" style="top:34%"></div><div class="co-fold" style="top:67%"></div>
  <span class="co-bracket tl"></span><span class="co-bracket tr"></span><span class="co-bracket bl"></span><span class="co-bracket br"></span>
  <div class="co-watermark" aria-hidden="true">CANDELA OBSCURA</div>
  <span class="co-print-small" style="position:absolute;top:14px;left:44px;z-index:2">Form C.O. 7 · Investigator record</span>
  <span class="co-print-serial" style="position:absolute;top:14px;right:44px;z-index:2">No. 89206</span>
  <div class="co-paper-body">
    <h2 style="margin:0 0 var(--space-md);font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--oxblood)">Profile</h2>
    <p style="margin:0 0 var(--space-lg);font-size:16px;line-height:1.5">Name your investigator and say what drew them into the dark.</p>
    <div class="co-well"><span style="font-weight:700;font-size:18px">Catalyst</span><br><span style="font-style:italic;color:var(--sepia)">A letter in a dead sister's hand.</span></div>
  </div>
</section>
</div>
</body>
</html>
