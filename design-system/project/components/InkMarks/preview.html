<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InkMarks</title></head>
<body>
<div class="co-stage-col">
  <div class="co-stage co-on-paper" style="gap:var(--space-xl);font-size:18px;color:var(--ink);border-radius:var(--radius-sm)"><span style="display:inline-flex;align-items:center;gap:6px"><svg class="co-inkmark" viewBox="0 0 12 12" stroke-width="1.9" aria-hidden="true"><path d="M2 6.6l2.7 2.6L10.2 3"/></svg>Tick</span><span style="display:inline-flex;align-items:center;gap:6px"><svg class="co-inkmark" viewBox="0 0 12 12" stroke-width="1.7" aria-hidden="true"><path d="M3 3.2l6 5.8M9 3L3.2 9"/></svg>Cross</span><span style="display:inline-flex;align-items:center;gap:6px"><svg class="co-inkmark" viewBox="0 0 12 12" stroke-width="2" aria-hidden="true"><path d="M4 2.4v7.2M8 2.4v7.2"/></svg>Pause</span><span style="display:inline-flex;align-items:center;gap:6px"><svg class="co-inkmark" viewBox="0 0 12 12" stroke-width="1.5" aria-hidden="true"><path d="M2.7 4.4A3.9 3.9 0 1 1 2.4 7.6"/><path d="M2.3 1.7l0.4 2.8l2.7-0.6"/></svg>Turn back</span><span style="display:inline-flex;align-items:center;gap:6px"><svg class="co-inkmark" viewBox="0 0 12 12" aria-hidden="true" style="fill:currentColor;stroke-width:1"><path d="M3 1.8L10.4 6L3 10.2Z"/></svg>Play</span><span style="display:inline-flex;align-items:center;gap:6px"><svg viewBox="0 0 24 34" aria-hidden="true" style="height:1em;width:auto;fill:currentColor"><path d="M10 1.5h4v8.5h8v4h-8v18.5h-4V14H2v-4h8Z"/></svg>Mourning cross</span></div>
  <div class="co-stage" style="gap:var(--space-xl);font-size:18px;color:var(--seal-green-lit);padding:0 var(--space-lg)"><span style="display:inline-flex;align-items:center;gap:6px"><svg class="co-inkmark" viewBox="0 0 12 12" stroke-width="1.9" aria-hidden="true"><path d="M2 6.6l2.7 2.6L10.2 3"/></svg>Invite sent</span></div>
</div>
</body>
</html>
