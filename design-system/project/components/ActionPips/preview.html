<!-- @dsCard group="Marks" height=190 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ActionPips</title><style>body{background:var(--parchment)}</style></head>
<body>
<div class="co-stage-col co-on-paper" style="max-width:420px">
  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px double color-mix(in srgb, var(--drive-nerve) 30%, transparent);padding-bottom:4px;--drive:var(--drive-nerve)">
    <span style="font-family:var(--font-sans);font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--drive-nerve)">Nerve</span>
    <span class="co-pips"><i class="co-drive-sq filled"></i><i class="co-drive-sq filled"></i><i class="co-drive-sq filled"></i><i class="co-drive-sq"></i><i class="co-drive-sq"></i><i class="co-drive-sq"></i></span>
  </div>
  <button class="co-chit" type="button">Move <span class="co-pips"><i class="co-pip filled"></i><i class="co-pip filled"></i><i class="co-pip"></i></span></button>
  <button class="co-chit" type="button">Strike <span class="co-pips"><i class="co-pip gilded"></i><i class="co-pip"></i><i class="co-pip"></i></span></button>
  <button class="co-chit" type="button">Control <span class="co-pips"><i class="co-pip"></i><i class="co-pip"></i><i class="co-pip"></i></span></button>
</div>
</body>
</html>
